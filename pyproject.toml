[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "distill-lab"
version = "0.1.0"
description = "distilling qwen3-4b into qwen3-0.6b, and measuring what actually transfers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "datasets>=3.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "wandb>=0.19",
]

[project.optional-dependencies]
# kaggle only, neither installs on a cpu-only windows box
gpu = ["vllm>=0.8.5", "bitsandbytes>=0.45"]
analysis = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["distill_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
